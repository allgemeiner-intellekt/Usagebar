name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild \
            -project JustaUsageBar.xcodeproj \
            -scheme JustaUsageBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            build
      - name: Verify install and update safeguards
        run: |
          app="build/DerivedData/Build/Products/Release/Usagebar.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$app/Contents/Info.plist")" = "true"
          test -f "$app/Contents/Resources/install_update_and_relaunch.sh"
          test ! -e Casks/justausagebar.rb
          ruby -c Casks/usagebar.rb
          ruby -rjson -e 'abort unless JSON.parse(File.read("cask_renames.json")) == {"justausagebar" => "usagebar"}'
      - name: Run performance and rendering regression tests
        run: ./script/test_performance.sh
      - name: Package personal build
        run: bash script/package_artifact.sh
      - name: Upload personal build
        uses: actions/upload-artifact@v4
        with:
          name: Usagebar-macos-universal-${{ github.sha }}
          path: build/Artifact/
          if-no-files-found: error
          retention-days: 30
